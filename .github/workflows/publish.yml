name: Publish AE-DOWNGRADER

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Smoke test the CLI
        run: |
          node dist/cli.cjs --version
          node dist/cli.cjs --matrix

      - name: Check the library bundles contain no Node-only imports
        run: |
          if grep -E "node:|require\(.(fs|path|os).\)" dist/index.mjs dist/index.cjs; then
            echo "Node-only import found in the library entry"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Stage the package on npm
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}