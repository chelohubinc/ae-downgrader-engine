name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22
        cache: "npm"

    - name: Install dependencies
      run: npm install

    - name: Type check
      run: npm run typecheck

    - name: Build package
      run: npm run build

    - name: Smoke test the CLI
      run: |
        node dist/cli.cjs --version
        node dist/cli.cjs --matrix

    - name: Check the library bundles contain no Node-only imports
      run: |
        if grep -E "node:|require\(.(fs|path|os).\)" dist/index.mjs dist/index.cjs; then
          echo "Node-only import found in the library entry"
          exit 1
        fi

    - name: Run tests
      run: npm test